<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a12"/>
      <stop offset="50%" stop-color="#0c2e1f"/>
      <stop offset="100%" stop-color="#144d32"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes shimmer {
      0% { opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { opacity: 0.3; }
    }
    .floating-badge { animation: float 4s ease-in-out infinite; }
    .pulse-glow { animation: pulse 3s ease-in-out infinite; }
    .shimmer-star { animation: shimmer 2.5s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-gradient)"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Glowing Abstract Organic Waves -->
  <g opacity="0.25">
    <path d="M-50,320 Q200,220 500,280 T1100,240 T1300,320 L1300,380 L-50,380 Z" fill="#10b981" />
    <path d="M-50,340 Q300,260 700,310 T1250,290 L1250,380 L-50,380 Z" fill="#047857" />
  </g>

  <!-- Dynamic Glowing Orbs -->
  <circle cx="1060" cy="90" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)" class="pulse-glow"/>
  <circle cx="150" cy="300" r="100" fill="#059669" opacity="0.15" filter="url(#glow)"/>

  <!-- Left Side: Icon & Title Content -->
  <g transform="translate(60, 48)">
    
    <!-- Top Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="250" height="32" rx="16" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1.2"/>
      <text x="16" y="21" fill="#34d399" font-size="13" class="tag-text" letter-spacing="1.5">🌱 SMART AGRI-TECH &amp; ERP</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="86" fill="#ffffff" font-size="46" class="title-text" letter-spacing="-0.5">
      Awesome Agricultural <tspan fill="url(#accent-green)">ERP</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="124" fill="#a7f3d0" font-size="19" class="subtitle-text">
      The Curated Ecosystem of Agribusiness SaaS &amp; Open-Source FMIS
    </text>

    <!-- Value propositions / Keywords -->
    <text x="0" y="160" fill="#94a3b8" font-size="14" class="subtitle-text">
      🌾 Farm Management • 🚜 Operations • 📊 Precision Analytics • 📦 Traceability • 📈 ERP Next-Gen
    </text>

    <!-- Feature Cards / Badges -->
    <g transform="translate(0, 195)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="52" rx="10" fill="#0b3824" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2" filter="url(#card-shadow)"/>
        <text x="14" y="24" fill="#6ee7b7" font-size="11" class="tag-text">COMMERCIAL SAAS</text>
        <text x="14" y="42" fill="#ffffff" font-size="14" class="title-text">Top Platforms &amp; ERPs</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(185, 0)">
        <rect width="180" height="52" rx="10" fill="#0b3824" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2" filter="url(#card-shadow)"/>
        <text x="14" y="24" fill="#6ee7b7" font-size="11" class="tag-text">OPEN SOURCE</text>
        <text x="14" y="42" fill="#ffffff" font-size="14" class="title-text">Self-Hosted &amp; Scalable</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(380, 0)">
        <rect width="180" height="52" rx="10" fill="#0b3824" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.2" filter="url(#card-shadow)"/>
        <text x="14" y="24" fill="#fbbf24" font-size="11" class="tag-text">TRANSPARENT</text>
        <text x="14" y="42" fill="#ffffff" font-size="14" class="title-text">Verified Pricing &amp; Stars</text>
      </g>
    </g>
  </g>

  <!-- Right Side Visual Illustration -->
  <g transform="translate(940, 170)" class="floating-badge">
    <!-- Big Circle Background -->
    <circle cx="60" cy="0" r="100" fill="#064e3b" stroke="#10b981" stroke-width="2.5" opacity="0.85" filter="url(#card-shadow)"/>
    <circle cx="60" cy="0" r="82" fill="#042f24" stroke="#34d399" stroke-dasharray="4,6" stroke-width="1.5"/>

    <!-- Central Sprout & Growth Icon -->
    <g transform="translate(25, -45)">
      <!-- Leaf 1 -->
      <path d="M35,65 C35,35 10,25 5,20 C5,45 20,65 35,65 Z" fill="#34d399"/>
      <!-- Leaf 2 -->
      <path d="M35,65 C35,30 65,15 70,10 C70,40 50,65 35,65 Z" fill="#10b981"/>
      <!-- Stem -->
      <path d="M35,65 L35,85" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round"/>
      <!-- Chart lines underneath sprout -->
      <path d="M10,85 L25,75 L45,80 L65,65" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="65" cy="65" r="4" fill="#fbbf24"/>
    </g>

    <!-- Floating Mini Stars / Indicators -->
    <circle cx="-15" cy="-60" r="3" fill="#6ee7b7" class="shimmer-star"/>
    <circle cx="130" cy="-40" r="4" fill="#fbbf24" class="shimmer-star"/>
    <circle cx="140" cy="50" r="2.5" fill="#34d399" class="shimmer-star"/>
    <circle cx="-25" cy="40" r="3.5" fill="#a7f3d0" class="shimmer-star"/>
  </g>
</svg>
